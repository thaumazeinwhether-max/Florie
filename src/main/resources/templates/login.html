<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ログイン | Florie</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
<main class="auth-page login-page">
    <div th:replace="~{fragments/logo :: logo}"></div>
    <h1 class="visually-hidden">ログイン</h1>
    <div class="notice" role="status" th:if="${param.registered}">登録が完了しました。ログインしてください。</div>
    <div class="notice" role="status" th:if="${param.logout}">ログアウトしました。</div>
    <div class="error notice" role="alert" th:if="${param.error}">メールアドレスまたはパスワードが正しくありません。</div>
    <form th:action="@{/login}" method="post" class="login-form">
        <div class="field">
            <label for="email">メールアドレス</label>
            <input id="email" name="email" type="email" maxlength="255" autocomplete="username" required>
        </div>
        <div class="field">
            <label for="password">パスワード</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button class="primary-button" type="submit">ログイン</button>
    </form>
    <div class="auth-navigation">
        <p>アカウントを持っていない方はこちら</p>
        <a th:href="@{/register}">新規登録</a>
    </div>
</main>
</body>
</html>
