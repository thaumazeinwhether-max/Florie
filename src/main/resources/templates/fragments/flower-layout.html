<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<body>
<header th:fragment="header" class="flower-header">
    <div th:replace="~{fragments/logo :: logo}"></div>
</header>
<nav th:fragment="homeLink" class="flower-nav" aria-label="画面移動">
    <a class="round-link" th:href="@{/home}">Home</a>
</nav>
<!-- 隣に花名を表示するため、画像自体の読み上げは省く。 -->
<img th:fragment="flowerIllustration(type)" class="flower-illustration"
     th:if="${!#strings.isEmpty(type.displayIllustrationPath)}"
     th:src="@{${type.displayIllustrationPath}}" alt="" width="220" height="300">
<p th:fragment="preservativeNote" class="care-note">この予定は、水道水だけで飾る場合の目安です。切り花用延命剤を使う場合は、製品に書かれた薄め方と水替え方法を優先してください。</p>
</body>
</html>
