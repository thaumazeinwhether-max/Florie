spring.application.name=Florie

spring.datasource.url=jdbc:mysql://localhost:3306/florie
spring.datasource.username=florie_app
# パスワードは起動する環境から受け取り、ファイルには保存しない。
spring.datasource.password=${FLORIE_DB_PASSWORD}

# テーブルはSQLで手動管理し、HibernateとSQLスクリプトによる自動初期化を行わない。
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=never

# エラー画面やJSONに内部の例外情報・入力値を含めない。
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
